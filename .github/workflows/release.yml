name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Run tests
        run: npm.cmd test

      - name: Build installer
        run: npm.cmd run build

      - name: Prepare release files
        id: files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag must be v$version."
          }

          $installer = Get-ChildItem -LiteralPath "dist" -Filter "*Setup*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstaller" } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "No installer was produced in dist."
          }

          $zip = Get-ChildItem -LiteralPath "dist" -Filter "*-win.zip" -File |
            Select-Object -First 1
          if ($null -eq $zip) {
            throw "No portable zip was produced in dist."
          }
          $portable = Join-Path $zip.DirectoryName "Lib Shammes $version portable.zip"
          Move-Item -LiteralPath $zip.FullName -Destination $portable

          "installer=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "portable=$([System.IO.Path]::GetFileName($portable))" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/${{ steps.files.outputs.installer }}
            dist/${{ steps.files.outputs.portable }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath "dist" -File | ForEach-Object { $_.FullName })

          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Lib Shammes $env:RELEASE_TAG" `
            --notes "Built and published by GitHub Actions."
