name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Run tests
        run: npm.cmd test

      - name: Build installer
        run: npm.cmd run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag must be v$version."
          }

          $installer = Get-ChildItem -LiteralPath "dist" -Filter "*Setup*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstaller" } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "No installer was produced in dist."
          }

          $zip = Get-ChildItem -LiteralPath "dist" -Filter "*-win.zip" -File |
            Select-Object -First 1
          if ($null -eq $zip) {
            throw "No portable zip was produced in dist."
          }
          $portable = Join-Path $zip.DirectoryName "Lib Shammes $version portable.zip"
          Move-Item -LiteralPath $zip.FullName -Destination $portable

          gh release create $env:RELEASE_TAG $installer.FullName $portable `
            --target $env:GITHUB_SHA `
            --title "Lib Shammes $env:RELEASE_TAG" `
            --notes "Built and published by GitHub Actions."
